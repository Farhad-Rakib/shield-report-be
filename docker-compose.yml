# LAN demo stack: mssql + mailhog + api (this repo) + fe (shield-report-fe).
#
# Requires shield-report-fe to be cloned as a SIBLING directory next to this repo, e.g.:
#   server/
#     shield-report-be/   <- this repo (contains this file)
#     shield-report-fe/
#
# Usage:
#   cp .env.example .env   # then set SERVER_IP to this machine's LAN IP
#   docker compose up -d --build
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shieldreport-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - shieldreport-net
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: shieldreport-mailhog
    ports:
      - "8025:8025" # web UI to view password-reset / notification emails sent during the demo
    networks:
      - shieldreport-net
    restart: unless-stopped

  # Backs the "Edit in Browser" report feature (ReportEditorModal.tsx). Not a hard startup
  # dependency of api/fe — same rationale as the scanner-image services below: if this is down,
  # only that one feature breaks, not the whole app.
  #
  # JWT_ENABLED=false is required explicitly here — current onlyoffice/documentserver images
  # default JWT to ON with an auto-generated random secret even with no JWT_* env vars set at
  # all, which the app has no way to learn or sign against. Without this, every editor session
  # fails client-side with "Document security token is not correctly formed" (Document Server
  # rejecting ReportEditorModal's un-signed config, confirmed via `docker logs` showing
  # `checkJwt error: jwt must be provided`). Fine for this internal demo network; a real
  # internet-facing deployment should flip this back on with an explicit JWT_SECRET the API
  # also knows, and sign the docEditor config accordingly (see INFRASTRUCTURE-PentestOps.md).
  #
  # ALLOW_PRIVATE_IP_ADDRESS=true is separately required: Document Server 9.x ships an SSRF
  # guard (request-filtering-agent) that refuses to fetch/callback any URL resolving to a
  # private IP range by default — which is exactly what `http://api:8080` (this compose
  # network's internal address) is. Without this, the editor UI opens but every document
  # load/save fails with "Download failed" (confirmed via docservice logs: "DNS lookup
  # 172.x.x.x ... is not allowed. Because, It is private IP address."). Same LAN-demo caveat
  # as JWT_ENABLED above — a real deployment reachable from the internet shouldn't need this
  # at all if api/onlyoffice are on public-ish addresses, or should scope it more narrowly.
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: shieldreport-onlyoffice
    environment:
      JWT_ENABLED: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    ports:
      - "8090:80"
    networks:
      - shieldreport-net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: shieldreport-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__SqlServerConnection: Server=mssql,1433;Database=ShieldReportDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: ShieldReport
      Jwt__Audience: ShieldReport.Client
      Cors__AllowedOrigins__0: http://${SERVER_IP}:${FE_PORT:-8080}
      Frontend__BaseUrl: http://${SERVER_IP}:${FE_PORT:-8080}
      Smtp__Host: mailhog
      Smtp__Port: 1025
      Smtp__Username: demo
      Smtp__Password: demo
      Smtp__FromAddress: no-reply@shieldreport.local
      Smtp__FromName: Shield Report
      Smtp__UseSsl: "false" # MailHog doesn't speak TLS
      # This demo serves everything over plain HTTP, and browsers refuse to store/send Secure
      # cookies on a non-HTTPS, non-"localhost" origin — without this, refresh-token renewal
      # silently breaks once the LAN IP is used. See RefreshTokenCookie.cs.
      Cookies__RequireSecure: "false"
      Serilog__MinimumLevel__Default: Information
      # DocumentServerUrl is fetched by the *browser* (to load the editor's api.js), so it must be
      # the LAN-reachable address, not localhost. ApiHostForContainer is fetched by the onlyoffice
      # *container* to pull/save the report draft — same compose network, so the service name and
      # its internal port work directly (plain HTTP; see Program.cs for why this stays unencrypted).
      OnlyOffice__DocumentServerUrl: http://${SERVER_IP}:8090
      OnlyOffice__ApiHostForContainer: http://api:8080
    ports:
      - "${API_PORT:-5050}:8080"
    volumes:
      # Docker-outside-of-Docker: lets DockerScanRunner (ShieldReport.Scanning) shell out to
      # `docker run` for Naabu/Nuclei/Reconftw against the HOST's Docker daemon. The api
      # container runs as root (no USER in src/Dockerfile), so it can access the socket
      # regardless of its host-side group ownership. Not a hard startup dependency on
      # scanner-images below — a broken/unavailable third-party scan-tool image shouldn't
      # block the app itself from coming up; the first scan with that tool just eats a pull.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mssql:
        condition: service_healthy
      nuclei-templates-populate:
        condition: service_completed_successfully
    networks:
      - shieldreport-net
    restart: unless-stopped

  # Pulls the scan tool images once as part of `docker compose up`/`pull`, so DockerScanRunner's
  # ephemeral `docker run` calls never have to pull on-demand mid-scan or after a redeploy.
  # These aren't long-running services — each just pulls its image and exits immediately.
  scanner-images:
    image: alpine:latest
    container_name: shieldreport-scanner-images
    depends_on:
      naabu-image:
        condition: service_completed_successfully
      nuclei-image:
        condition: service_completed_successfully
      reconftw-image:
        condition: service_completed_successfully
    command: ["true"]
    restart: "no"
    networks:
      - shieldreport-net

  naabu-image:
    image: projectdiscovery/naabu:latest
    container_name: shieldreport-naabu-image
    entrypoint: ["true"]
    restart: "no"
    networks:
      - shieldreport-net

  # One-time permission fixup for the persistent Nuclei template cache (DockerScanRunner.cs
  # mounts `nuclei-templates` into every Nuclei scan container at /tmp/nuclei-templates so
  # templates download once instead of on every single scan). A freshly created named volume is
  # root-owned; Nuclei's scan containers run as --user 1000:1000 (no root, see DockerScanRunner's
  # own comments on why), so without this they'd hit the same class of "permission denied"
  # writing into it that $HOME=/tmp already works around for nuclei's config dir. Confirmed via
  # a manual `docker run --user 1000:1000` against the un-chmod'd volume failing with exactly
  # that error. Runs once and exits; safe to re-run on every `docker compose up`.
  nuclei-templates-init:
    image: alpine:latest
    container_name: shieldreport-nuclei-templates-init
    command: ["chmod", "-R", "777", "/data"]
    volumes:
      - nuclei-templates:/data
    restart: "no"
    networks:
      - shieldreport-net

  # Pre-populates the (now-writable) volume with the actual template files. DockerScanRunner.cs
  # invokes nuclei per-scan with `-t /tmp/nuclei-templates` (the *read* flag) — nuclei does not
  # auto-install templates into a custom -t directory on a normal scan run, it just fails
  # instantly with "no templates provided for scan" if that directory is empty. `-update-templates
  # -ud <dir>` is the only thing that actually populates a custom directory; confirmed both
  # behaviors manually before landing on this two-step (chmod, then populate) shape. Safe/cheap to
  # re-run on every `docker compose up` — nuclei no-ops ("No new updates found") once current.
  nuclei-templates-populate:
    image: projectdiscovery/nuclei:latest
    container_name: shieldreport-nuclei-templates-populate
    user: "1000:1000"
    environment:
      HOME: /tmp
    entrypoint: ["nuclei"]
    command: ["-update-templates", "-ud", "/tmp/nuclei-templates"]
    volumes:
      - nuclei-templates:/tmp/nuclei-templates
    depends_on:
      nuclei-templates-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - shieldreport-net

  nuclei-image:
    image: projectdiscovery/nuclei:latest
    container_name: shieldreport-nuclei-image
    entrypoint: ["true"]
    restart: "no"
    networks:
      - shieldreport-net

  # six2dez/reconftw only publishes a linux/arm64 manifest on Docker Hub (verified via
  # `docker manifest inspect six2dez/reconftw:latest` — no linux/amd64 entry exists at all).
  # Pinning the platform here means this pulls natively on arm64 hosts and via QEMU emulation
  # on amd64 hosts, instead of failing outright with "no matching manifest for linux/amd64".
  # DockerScanRunner.cs must pass the same --platform linux/arm64 flag when it invokes this
  # image at scan time, or the runtime `docker run` call hits the identical error.
  reconftw-image:
    image: six2dez/reconftw:latest
    platform: linux/arm64
    container_name: shieldreport-reconftw-image
    entrypoint: ["true"]
    restart: "no"
    networks:
      - shieldreport-net

  fe:
    build:
      context: ../shield-report-fe
      dockerfile: Dockerfile
    container_name: shieldreport-fe
    depends_on:
      - api
    environment:
      # Baked into a static file at container startup (see shield-report-fe/docker/entrypoint.sh),
      # so this image never needs to be rebuilt just because SERVER_IP changes.
      API_BASE_URL: http://${SERVER_IP}:${API_PORT:-5050}/api/v1
      CSP_CONNECT_SRC: http://${SERVER_IP}:${API_PORT:-5050} ws://${SERVER_IP}:${API_PORT:-5050}
      CSP_ONLYOFFICE_SRC: http://${SERVER_IP}:8090
    ports:
      - "${FE_PORT:-8080}:80"
    networks:
      - shieldreport-net
    restart: unless-stopped

networks:
  shieldreport-net:
    driver: bridge

volumes:
  mssql_data:
  # Pinned to this exact literal name (no compose project-name prefix) because
  # DockerScanRunner.cs references it via a bare `docker run -v nuclei-templates:...` — that's a
  # raw Docker CLI call outside of compose, so it has no notion of "this compose project's"
  # volume naming and would otherwise silently talk to a second, different, unprefixed volume
  # of the same short name that Docker auto-creates on first reference (confirmed: this is
  # exactly what caused "no templates provided for scan" to persist even after the
  # nuclei-templates-populate step succeeded — it was populating shield-report-be_nuclei-templates
  # while every real scan mounted a completely different, empty, auto-created nuclei-templates).
  nuclei-templates:
    name: nuclei-templates
