# ShieldReport stack: proxy (only public entry) + mssql + api + fe + backup + scanner images.
#
# Requires shield-report-fe cloned as a SIBLING directory next to this repo:
#   server/
#     shield-report-be/   <- this repo (contains this file)
#     shield-report-fe/
#
# Usage:
#   cp .env.example .env   # set SITE_ADDRESS / PUBLIC_URL and the secrets
#   docker compose up -d --build --remove-orphans
#
# Only the `proxy` service publishes ports (80/443). SQL Server, the API and the frontend are
# reachable only on the internal network; a debug API port binds to 127.0.0.1 (use an SSH
# tunnel to reach it on a remote server).
#
# Images are pinned by digest (see .env.example) so an upstream ":latest" can't silently change
# behaviour. To upgrade, change the digest in .env, take a backup, then `up -d`.
services:
  proxy:
    image: ${CADDY_IMAGE:-caddy:2.8.4-alpine}
    container_name: shieldreport-proxy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificates — keep, or Let's Encrypt rate limits bite on rebuilds
      - caddy_config:/config
    depends_on:
      - api
      - fe
    networks:
      - shieldreport-net
    restart: unless-stopped

  mssql:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server@sha256:e07b9699a2b749969f19d86563ceeea22bd3a69f7f1db85a8d1ac4bdaf0c6f56}
    container_name: shieldreport-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      # Express is free for production use (Developer, the image default, is not licensed for
      # it). Limits: 10 GB per database, ~1.4 GB buffer pool, 4 cores — fine for the MVP.
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
    volumes:
      - mssql_data:/var/opt/mssql
      - mssql_backups:/var/opt/mssql/backups
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - shieldreport-net
    restart: unless-stopped

  # Nightly SQL Server backup + uploads/DataProtection-keys archive with retention. Reuses the
  # mssql image for sqlcmd (no extra download). See docker/backup/README.md for restore steps.
  backup:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server@sha256:e07b9699a2b749969f19d86563ceeea22bd3a69f7f1db85a8d1ac4bdaf0c6f56}
    container_name: shieldreport-backup
    user: "0"
    entrypoint: ["/bin/bash", "/scripts/backup.sh"]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_ON_START: ${BACKUP_ON_START:-true}
    volumes:
      - ./docker/backup/backup.sh:/scripts/backup.sh:ro
      - mssql_backups:/backups
      - api_uploads:/data/uploads:ro
      - dataprotection_keys:/data/dataprotection-keys:ro
    depends_on:
      mssql:
        condition: service_healthy
    networks:
      - shieldreport-net
    restart: unless-stopped

  api:
    # Longer than Program.cs's HostOptions.ShutdownTimeout (40s). Scans detach on shutdown (their
    # containers keep running and are re-attached on start), so this mostly covers jobs/saves.
    stop_grace_period: 50s
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: shieldreport-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__SqlServerConnection: Server=mssql,1433;Database=ShieldReportDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: ShieldReport
      Jwt__Audience: ShieldReport.Client
      # Frontend and API share one origin behind the proxy, so CORS is effectively unused.
      Cors__AllowedOrigins__0: ${PUBLIC_URL}
      Frontend__BaseUrl: ${PUBLIC_URL}
      # Outgoing mail is configured in the app (Administration -> Email Configuration). These
      # are only a fallback used until that form is saved; leave SMTP_HOST empty to rely on it.
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-Shield Report}
      Smtp__UseSsl: ${SMTP_USE_SSL:-true}
      # true once PUBLIC_URL is https:// — browsers drop Secure cookies on plain-HTTP origins,
      # which silently breaks refresh-token renewal (see RefreshTokenCookie.cs).
      Cookies__RequireSecure: ${COOKIES_REQUIRE_SECURE:-false}
      Serilog__MinimumLevel__Default: Information
      # Requests per minute: per signed-in user, and per client IP for anonymous calls (login).
      RateLimiting__PerUserPerMinute: ${RATE_LIMIT_PER_USER_PER_MINUTE:-600}
      RateLimiting__AnonymousPerMinute: ${RATE_LIMIT_ANONYMOUS_PER_MINUTE:-30}
      # Scanner images: must match the images pulled below, since DockerScanRunner invokes them
      # by these exact references through the host Docker daemon.
      Scanning__Tools__Naabu__Image: ${NAABU_IMAGE:-projectdiscovery/naabu@sha256:0b7efcd6eb4bf7be2c5cfb2bbfe091a132df0e442e549267bca818a4cef15ea4}
      Scanning__Tools__Nuclei__Image: ${NUCLEI_IMAGE:-projectdiscovery/nuclei@sha256:66b5f88c9b98ad29c03343dd34e5e85bde0ad10428d72e0171b067efe1ed7811}
      Scanning__Tools__Reconftw__Image: shieldreport/reconftw-lean:latest
    ports:
      # Debug access only, bound to localhost (the public path is the proxy).
      - "127.0.0.1:${API_PORT:-5050}:8080"
    volumes:
      # Docker-outside-of-Docker: DockerScanRunner runs the scanner containers on the HOST's
      # daemon. This is effectively root on the host — the future scan runner removes it.
      - /var/run/docker.sock:/var/run/docker.sock
      # Report drafts/PDFs, templates and attachments (App_Data/uploads under /app).
      - api_uploads:/app/App_Data/uploads
      # reconftw result files (DockerScanRunner mounts the same volume at /scan-output).
      - scan_output:/app/scan-output
      # DataProtection key ring — losing it orphans every encrypted LLM API key.
      - dataprotection_keys:/app/DataProtection-Keys
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      mssql:
        condition: service_healthy
      nuclei-templates-populate:
        condition: service_completed_successfully
    networks:
      - shieldreport-net
    restart: unless-stopped

  fe:
    build:
      context: ../shield-report-fe
      dockerfile: Dockerfile
    container_name: shieldreport-fe
    depends_on:
      - api
    environment:
      # Relative: the SPA calls its own origin (the proxy), so it works on any host name and
      # over HTTPS, and the SignalR hub resolves to /hubs/notifications on the same origin.
      API_BASE_URL: /api/v1
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-}
    networks:
      - shieldreport-net
    restart: unless-stopped

  # ---- Scanner images: pulled/built once on `up`, then run on demand by DockerScanRunner ----

  scanner-images:
    image: ${ALPINE_IMAGE:-alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b}
    container_name: shieldreport-scanner-images
    depends_on:
      naabu-image:
        condition: service_completed_successfully
      nuclei-image:
        condition: service_completed_successfully
      reconftw-image:
        condition: service_completed_successfully
    command: ["true"]
    restart: "no"
    networks:
      - shieldreport-net

  naabu-image:
    image: ${NAABU_IMAGE:-projectdiscovery/naabu@sha256:0b7efcd6eb4bf7be2c5cfb2bbfe091a132df0e442e549267bca818a4cef15ea4}
    container_name: shieldreport-naabu-image
    entrypoint: ["true"]
    restart: "no"
    networks:
      - shieldreport-net

  # Nuclei templates live in a persistent volume (pinned literal name: DockerScanRunner mounts it
  # with a raw `docker run -v nuclei-templates:...`, outside compose's project-name prefixing).
  # Step 1 makes the fresh root-owned volume writable for UID 1000; step 2 downloads/updates the
  # templates (cheap no-op once current). Templates float on purpose: new CVE checks.
  nuclei-templates-init:
    image: ${ALPINE_IMAGE:-alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b}
    container_name: shieldreport-nuclei-templates-init
    command: ["chmod", "-R", "777", "/data"]
    volumes:
      - nuclei-templates:/data
    restart: "no"
    networks:
      - shieldreport-net

  nuclei-templates-populate:
    image: ${NUCLEI_IMAGE:-projectdiscovery/nuclei@sha256:66b5f88c9b98ad29c03343dd34e5e85bde0ad10428d72e0171b067efe1ed7811}
    container_name: shieldreport-nuclei-templates-populate
    user: "1000:1000"
    environment:
      HOME: /tmp
    entrypoint: ["nuclei"]
    command: ["-update-templates", "-ud", "/tmp/nuclei-templates"]
    volumes:
      - nuclei-templates:/tmp/nuclei-templates
    depends_on:
      nuclei-templates-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - shieldreport-net

  nuclei-image:
    image: ${NUCLEI_IMAGE:-projectdiscovery/nuclei@sha256:66b5f88c9b98ad29c03343dd34e5e85bde0ad10428d72e0171b067efe1ed7811}
    container_name: shieldreport-nuclei-image
    entrypoint: ["true"]
    restart: "no"
    networks:
      - shieldreport-net

  # Lean derived reconftw image (docker/reconftw/: upstream pinned by digest + reconftw.lean.cfg).
  # Upstream only publishes linux/arm64, so on amd64 hosts it runs under QEMU emulation.
  reconftw-image:
    build:
      context: ./docker/reconftw
    image: shieldreport/reconftw-lean:latest
    platform: linux/arm64
    container_name: shieldreport-reconftw-image
    entrypoint: ["true"]
    restart: "no"
    networks:
      - shieldreport-net

networks:
  shieldreport-net:
    driver: bridge

volumes:
  mssql_data:
  mssql_backups:
    name: shieldreport-backups
  api_uploads:
  dataprotection_keys:
  caddy_data:
  caddy_config:
  nuclei-templates:
    name: nuclei-templates
  scan_output:
    name: shieldreport-scan-output
